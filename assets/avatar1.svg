<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Avatar par défaut">
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3.2" fill="#fff"/>
    </pattern>
    <pattern id="ink" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.7" fill="#0a0a0a"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".3" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="m-glow"><rect width="512" height="512" fill="url(#glow)"/></mask>
    <mask id="m-shade"><rect width="512" height="512" fill="url(#shade)"/></mask>
    <clipPath id="body">
      <circle cx="256" cy="204" r="88"/>
      <path d="M92 480c0-88 72-150 164-150s164 62 164 150z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="#0a0a0a"/>
  <rect width="512" height="512" fill="url(#dots)" mask="url(#m-glow)" opacity=".55"/>
  <circle cx="256" cy="204" r="88" fill="#f4f4f4"/>
  <path d="M92 480c0-88 72-150 164-150s164 62 164 150z" fill="#f4f4f4"/>
  <g clip-path="url(#body)">
    <rect width="512" height="512" fill="url(#ink)" mask="url(#m-shade)"/>
  </g>
</svg>
